apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "certific-generator.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certific-generator.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.env.appEnv | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  PORT: {{ .Values.env.port | quote }}
  PDF_SERVICE_URL: "http://{{ include "certific-generator.fullname" . }}-pdf-service:{{ .Values.env.pdfServicePort }}"
  MONGO_HOST: "{{ include "certific-generator.fullname" . }}-mongodb"
  MONGO_PORT: "27017"