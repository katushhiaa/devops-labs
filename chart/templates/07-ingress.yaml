{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "certific-generator.fullname" . }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certific-generator.labels" . | nindent 4 }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "certific-generator.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}