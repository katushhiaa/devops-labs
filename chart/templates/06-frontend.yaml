apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "certific-generator.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certific-generator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "certific-generator.fullname" . }}-frontend
  template:
    metadata:
      labels:
        app: {{ include "certific-generator.fullname" . }}-frontend
        {{- include "certific-generator.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "certific-generator.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certific-generator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.serviceType }}
  selector:
    app: {{ include "certific-generator.fullname" . }}-frontend
  ports:
    - port: 80
      targetPort: 80