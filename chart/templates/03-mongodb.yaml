apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "certific-generator.fullname" . }}-mongodb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certific-generator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "certific-generator.fullname" . }}-mongodb
  template:
    metadata:
      labels:
        app: {{ include "certific-generator.fullname" . }}-mongodb
        {{- include "certific-generator.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.images.mongodb.repository }}:{{ .Values.images.mongodb.tag }}"
          imagePullPolicy: {{ .Values.images.mongodb.pullPolicy }}
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "certific-generator.fullname" . }}-mongodb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certific-generator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.serviceType }}
  selector:
    app: {{ include "certific-generator.fullname" . }}-mongodb
  ports:
    - port: 27017
      targetPort: 27017