{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "certific-generator.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certific-generator.labels" . | nindent 4 }}
type: Opaque
data:
  MONGO_INITDB_ROOT_PASSWORD: {{ "default-root-password" | b64enc | quote }}
{{- end -}}