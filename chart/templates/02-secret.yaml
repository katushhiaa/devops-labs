apiVersion: v1
kind: Secret
metadata:
  name: {{ include "certific-generator.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certific-generator.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET: {{ .Values.secrets.jwtSecret | quote }}
  MONGO_URI: {{ .Values.secrets.mongoUri | quote }}