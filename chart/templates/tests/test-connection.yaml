apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "certific-generator.fullname" . }}-test-connection"
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "certific-generator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O', '-', 'http://{{ include "certific-generator.fullname" . }}-frontend:80']
  restartPolicy: Never