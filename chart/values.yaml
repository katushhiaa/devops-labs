namespace: anurieva

replicaCount: 2

serviceType: ClusterIP

env:
  appEnv: "development"
  logLevel: "debug"
  port: "3001"
  pdfServicePort: "3002"

secrets:
  jwtSecret: "cert-generator-jwt-super-secret-key-2026"
  mongoUri: "mongodb://cert-app-certific-generator-mongodb:27017/diploma_db"

images:
  backend:
    repository: certific_generation-backend
    tag: latest
    pullPolicy: Never
  pdfService:
    repository: certific_generation-pdf-service
    tag: latest
    pullPolicy: Never
  frontend:
    repository: certific_generation-frontend
    tag: latest
    pullPolicy: Never
  mongodb:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: false
  size: 1Gi

ingress:
  enabled: true
  host: cert-generator.local