namespace: anurieva
replicaCount: 5

rollout:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {} 
        - setWeight: 60
        - pause: { duration: 30s }
        - setWeight: 80
        - pause: { duration: 30s }

existingSecret: cert-app-secret

secrets:
  jwtSecret: "cert-generator-jwt-super-secret-key-2026"
  mongoUri: "mongodb://root:rootpassword@cert-app-certific-generator-mongodb:27017/diploma_db?authSource=admin"

images:
  backend:
    repository: ghcr.io/katushhiaa/cert-backend
    tag: "1.1.0"
    pullPolicy: Always
  frontend:
    repository: ghcr.io/katushhiaa/cert-frontend
    tag: "1.1.0"
    pullPolicy: Always
  pdfService:
    repository: ghcr.io/katushhiaa/cert-pdf-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent