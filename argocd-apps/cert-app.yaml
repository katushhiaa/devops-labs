apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/katushhiaa/devops-labs.git
    targetRevision: feature/setup-ci
    path: chart
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: anurieva
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true