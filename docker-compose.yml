services:
  # 1. MongoDB (База даних)
  mongodb:
    image: mongo:7.0
    container_name: cert_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: cert_database
    ports:
      - "27017:27017"
    volumes:
      - cert_mongo_data:/data/db
    networks:
      - cert_network

  # 2. PDF Microservice (Генератор PDF / Сертифікатів)
  pdf-service:
    build:
      context: ./pdf-service
      dockerfile: Dockerfile
    container_name: cert_pdf_service
    restart: always
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    networks:
      - cert_network

  # 3. Node.js Express Backend (Основний API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cert_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      SECRET: your_jwt_secret_key_here
      MONGO_URI: mongodb://admin:password123@mongodb:27017/cert_database?authSource=admin
      PDF_SERVICE_URL: http://pdf-service:3002
    ports:
      - "3001:3001"
    networks:
      - cert_network
    depends_on:
      - mongodb
      - pdf-service

  # 4. Vue 3 Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cert_frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - cert_network
    depends_on:
      - backend

volumes:
  cert_mongo_data:
    driver: local

networks:
  cert_network:
    driver: bridge