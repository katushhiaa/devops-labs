name: Continuous Integration & Delivery

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:

  # 1. Backend CI (Build, Lint, Test)
  test-backend:
    name: Backend - Lint & Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Static Code Analysis (Lint)
        run: npm run lint

      - name: Wait for MongoDB
        run: sleep 3

      - name: Run Backend Unit Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/test-database
        run: npx jest --detectOpenHandles --forceExit


  # 2. PDF Service CI (Build, Test)
  test-pdf-service:
    name: PDF Service - Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pdf-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pdf-service/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run PDF Service Tests
        run: npm test


  # 3. Frontend CI (Build, Lint)
  test-frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Static Code Analysis (Lint)
        run: npm run lint

      - name: Build Frontend Artifacts (Vite)
        run: npm run build


  # 4. Build & Security Scan Docker Images for ALL 3 Services
  build-docker-images:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-pdf-service, test-frontend]
    strategy:
      matrix:
        service:
          - name: backend
            context: .
            dockerfile: Dockerfile.backend
          - name: pdf-service
            context: ./pdf-service
            dockerfile: ./pdf-service/Dockerfile
          - name: frontend
            context: .
            dockerfile: Dockerfile.frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local container image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service.name }}:local-test

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service.name }}:local-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


  # 5. Publish Images to GitHub Container Registry (ghcr.io)
  publish-images:
    name: Publish Images to GHCR
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - name: cert-backend
            context: .
            dockerfile: Dockerfile.backend
          - name: cert-pdf-service
            context: ./pdf-service
            dockerfile: ./pdf-service/Dockerfile
          - name: cert-frontend
            context: .
            dockerfile: Dockerfile.frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}